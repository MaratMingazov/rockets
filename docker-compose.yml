services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rockets
      POSTGRES_USER: rockets
      POSTGRES_PASSWORD: rockets
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rockets -d rockets"]
      interval: 2s
      timeout: 3s
      retries: 15

  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: [monitoring]
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres-data:
